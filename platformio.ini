; CustomRC - F1: base PlatformIO
;
; Ambientes:
;   car     -> firmware do ESP32 do carro    (src/car)
;   remote  -> firmware do ESP32 do controle (src/remote)
;   native  -> testes da lib rc_protocol no PC: `pio test -e native`
;
; A lib rc_protocol e C++ puro (so <stdint.h>/<stddef.h>): nenhuma dependencia de
; Arduino.h. E isso que permite compilar os MESMOS arquivos no PC e no ESP32, e e
; a razao de os testes `native` valerem alguma coisa.

[platformio]
default_envs = car, remote

[esp32_base]
; A plataforma OFICIAL do PlatformIO (espressif32 @ 7.x) ainda entrega o Arduino
; core 2.0.17 -- nao acompanhou o 3.x. Isso importa muito aqui: no 3.x o callback
; de recepcao do ESP-NOW mudou de assinatura (esp_now_recv_info_t) e o de envio
; passou a receber wifi_tx_info_t. A F0 foi validada no core 3.3.12 pelo
; arduino-cli, entao o PlatformIO precisa usar o MESMO core, senao os dois
; caminhos de build divergem em API.
; O fork pioarduino e o que publica o 3.x; a tag abaixo e exatamente o 3.3.12.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
; 115200 na gravacao, e nao os 460800 padrao: em 28/09/2026 o controle falhou com
; "Failed to communicate with the flash chip" e "Possible serial noise or
; corruption" ao subir para 460800. Velocidade baixa e mais tolerante a ruido e
; custa poucos segundos a mais.
upload_speed = 115200
build_flags = -Wall -Wextra -std=gnu++17
build_unflags = -std=gnu++11

[env:car]
extends = esp32_base
build_src_filter = +<car/>

[env:remote]
extends = esp32_base
build_src_filter = +<remote/>

[env:native]
platform = native
test_framework = unity
; src/ contem codigo Arduino: fora do build nativo. Só lib/ e test/ entram.
build_src_filter = -<*>
build_flags = -Wall -Wextra -std=c++17
